{% extends "base.html" %}

{% block title %}Sign In - TrustVault{% endblock %}

{% block content %}
<div class="max-w-md mx-auto theme-bg-card p-8 rounded-2xl border theme-border shadow-xl mt-8">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold theme-text-main">Sign In to TrustVault</h2>
        <p class="text-xs theme-text-muted mt-1">Multi-Tenant Document Security Portal</p>
    </div>

    <form action="{{ url_for('login') }}" method="POST" class="space-y-5">
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider theme-text-muted mb-2">Username</label>
            <input type="text" name="username" required placeholder="Enter username" class="w-full px-4 py-2.5 theme-input border theme-border rounded-xl theme-text-main focus:outline-none text-sm">
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider theme-text-muted mb-2">Password</label>
            <div class="relative">
                <input type="password" id="loginPwd" name="password" required placeholder="Enter password" class="w-full px-4 py-2.5 theme-input border theme-border rounded-xl theme-text-main focus:outline-none text-sm pr-10">
                <button type="button" onclick="togglePassword('loginPwd', 'eyeIcon')" class="absolute inset-y-0 right-0 pr-3 flex items-center theme-text-muted hover:theme-text-main">
                    <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </button>
            </div>
        </div>

        <button type="submit" class="w-full theme-accent text-white font-semibold py-3 rounded-xl transition shadow-md text-sm">
            Sign In
        </button>
    </form>

    <div class="mt-6 text-center text-xs theme-text-muted">
        Don't have an account? <a href="{{ url_for('register') }}" class="text-[#C85A17] font-semibold hover:underline">Register here</a>
    </div>
</div>

<script>
function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.018 10.018 0 013.682-.813c4.478 0 8.268 2.943 9.543 7a9.97 9.97 0 01-4.132 5.411m0 0L21 21M3 3l18 18" />`;
    } else {
        input.type = 'password';
        icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
    }
}
</script>
{% endblock %}
