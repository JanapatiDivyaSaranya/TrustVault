{% extends "base.html" %}

{% block title %}Register - TrustVault{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12 bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-700">
    <h2 class="text-2xl font-bold text-center text-emerald-400 mb-6">Create TrustVault Account</h2>
    
    <form action="{{ url_for('register') }}" method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Username</label>
            <input type="text" name="username" required class="w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-emerald-500">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Email Address</label>
            <input type="email" name="email" required class="w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-emerald-500">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-emerald-500">
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg transition">Register</button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-400">
        Already registered? <a href="{{ url_for('login') }}" class="text-emerald-400 hover:underline">Login here</a>
    </p>
</div>
{% endblock %}
