{% extends "base.html" %}

{% block title %}Upload Document - TrustVault{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl border border-[#E5DED4] shadow-sm">
    <h2 class="text-2xl font-bold text-[#5B1024] mb-2">Upload Secure Document</h2>
    <p class="text-xs text-[#7A686B] mb-6">Files are validated against extensions (.pdf, .docx, .png, .jpg, .xlsx, .csv, .txt) and logged in audit trails.</p>

    <form action="{{ url_for('upload_file') }}" method="POST" enctype="multipart/form-data" class="space-y-5">
        <div>
            <label class="block text-sm font-medium text-[#2B181C] mb-1">Document Title</label>
            <input type="text" name="title" placeholder="e.g. Q3 Financial Audit Report" required class="w-full px-4 py-2.5 bg-[#F9F6F0] border border-[#E5DED4] rounded-xl text-[#2B181C] focus:border-[#5B1024] focus:outline-none text-sm">
        </div>

        <div>
            <label class="block text-sm font-medium text-[#2B181C] mb-1">Document Category</label>
            <select name="category" class="w-full px-4 py-2.5 bg-[#F9F6F0] border border-[#E5DED4] rounded-xl text-[#2B181C] focus:border-[#5B1024] focus:outline-none text-sm">
                <option value="Financial">Financial</option>
                <option value="Legal">Legal</option>
                <option value="HR">HR</option>
                <option value="Technical">Technical</option>
                <option value="Executive">Executive</option>
                <option value="General">General</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-[#2B181C] mb-1">Select File</label>
            <input type="file" name="file" required class="w-full px-4 py-2 bg-[#F9F6F0] border border-[#E5DED4] rounded-xl text-sm text-[#7A686B] focus:outline-none">
        </div>

        <button type="submit" class="w-full bg-[#5B1024] hover:bg-[#701A31] text-white font-semibold py-3 rounded-xl transition shadow-sm text-sm">
            Encrypt & Upload to Vault
        </button>
    </form>
</div>
{% endblock %}
